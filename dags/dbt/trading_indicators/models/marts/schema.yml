version: 2

models:
  - name: stock_indicators
    description: >
      Daily technical indicators per tracked symbol: SMA 20/50/200, RSI-14,
      MACD (12/26/9), 20-day Bollinger z-score, and 20-day volume ratio.
      Consumed by the trade_advisor DAG.
    columns:
      - name: symbol
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null
      - name: close
        tests:
          - not_null
